name: Atualizar CDI e IPCA
on:
  schedule:
    - cron: '17 12 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Consultar Banco Central
        run: python scripts/update_indices.py
      - name: Publicar dados somente se alterados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/indices.json
          if ! git diff --cached --quiet; then
            git commit -m "data: atualizar CDI e IPCA oficiais"
            git push
          fi
